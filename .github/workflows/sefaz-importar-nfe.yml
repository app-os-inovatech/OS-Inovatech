# Importa de hora em hora, para o Odoo, as NF-e emitidas contra os CNPJs do grupo (ver backend/scripts/sefaz-importar-nfe.js).
# Secrets necessários (Settings → Secrets and variables → Actions):
#   ODOO_URL, ODOO_DB, ODOO_API_KEY
#   SEFAZ_CERT_<CNPJ>_PFX (arquivo .pfx em base64), para cada empresa
#   SEFAZ_CERT_SENHA (senha dos .pfx; se alguma for diferente, use SEFAZ_CERT_<CNPJ>_SENHA)
name: Importar NF-e da SEFAZ

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      simular:
        description: 'Só simular (não grava nada)'
        type: boolean
        default: false

concurrency:
  group: sefaz-importar-nfe
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts
      - name: Importar NF-e
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          SEFAZ_CERT_SENHA: ${{ secrets.SEFAZ_CERT_SENHA }}
          SEFAZ_CERT_47383189000102_PFX: ${{ secrets.SEFAZ_CERT_47383189000102_PFX }}
          SEFAZ_CERT_16586600000113_PFX: ${{ secrets.SEFAZ_CERT_16586600000113_PFX }}
          SEFAZ_CERT_47696866000142_PFX: ${{ secrets.SEFAZ_CERT_47696866000142_PFX }}
        run: node scripts/sefaz-importar-nfe.js ${{ (github.event_name == 'schedule' || !inputs.simular) && '--aplicar' || '' }}
